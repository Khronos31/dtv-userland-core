name: Host Authority Bridge Windows

on:
  pull_request:
    paths:
      - '.github/workflows/host-authority-bridge-windows.yml'
      - 'adapters/host_daemon/**'
      - 'include/dtv/userland/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  base_msvc_compare:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8a840a7e44932db5baa897fd41da9a1035e58c7
      - name: Configure base
        run: >-
          cmake -S . -B build -A x64
          -DDTV_USERLAND_BUILD_TESTING=ON
          -DDTV_USERLAND_BUILD_RECEIVER=ON
          -DDTV_USERLAND_BUILD_CARD=ON
          -DDTV_USERLAND_BUILD_CAPTURE=ON
          -DDTV_USERLAND_BUILD_CONTROL=ON
          -DDTV_USERLAND_BUILD_STATUS_PROJECTION=ON
          -DDTV_USERLAND_BUILD_AUTHORITY=ON
          -DDTV_USERLAND_BUILD_HOST_TUNER=ON
          -DDTV_USERLAND_BUILD_HOST_AUTHORITY_OWNER=ON
          -DDTV_USERLAND_BUILD_HOST_WORKERS=ON
          -DDTV_USERLAND_BUILD_HOST_AUTHORITY_BRIDGE=ON
      - name: Confirm base missing compatibility header
        shell: pwsh
        run: |
          $output = cmake --build build --config Release --target host_authority_bridge_tests 2>&1
          $buildExit = $LASTEXITCODE
          $output | Out-File -FilePath build.log
          if ($buildExit -eq 0) { throw 'Base unexpectedly builds the MSVC bridge target' }
          if (-not (Select-String -Path build.log -Pattern 'windows_pthread_compat.h')) {
            throw 'Base failed for a reason other than the missing pthread compatibility header'
          }
          Write-Host "base_head=a8a840a7e44932db5baa897fd41da9a1035e58c7 expected_missing_header_failure=$buildExit"
          exit 0

  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DDTV_USERLAND_BUILD_TESTING=ON
          -DDTV_USERLAND_BUILD_RECEIVER=ON
          -DDTV_USERLAND_BUILD_CARD=ON
          -DDTV_USERLAND_BUILD_CAPTURE=ON
          -DDTV_USERLAND_BUILD_CONTROL=ON
          -DDTV_USERLAND_BUILD_STATUS_PROJECTION=ON
          -DDTV_USERLAND_BUILD_AUTHORITY=ON
          -DDTV_USERLAND_BUILD_HOST_TUNER=ON
          -DDTV_USERLAND_BUILD_HOST_AUTHORITY_OWNER=ON
          -DDTV_USERLAND_BUILD_HOST_WORKERS=ON
          -DDTV_USERLAND_BUILD_HOST_AUTHORITY_BRIDGE=ON
      - name: Prepare protected worker runtime parent
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'dtv-userland-core-runtime'
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $acl = Get-Acl $runtimeRoot
          $acl.SetOwner($identity.User)
          $acl.SetAccessRuleProtection($true, $false)
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $identity.User,
            [System.Security.AccessControl.FileSystemRights]::FullControl,
            [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
              [System.Security.AccessControl.InheritanceFlags]::ObjectInherit,
            [System.Security.AccessControl.PropagationFlags]::None,
            [System.Security.AccessControl.AccessControlType]::Allow)
          $acl.SetAccessRule($rule)
          Set-Acl -Path $runtimeRoot -AclObject $acl
          Add-Content -Path $env:GITHUB_ENV -Value "LOCALAPPDATA=$runtimeRoot"
          Write-Host "worker_runtime_parent=$runtimeRoot"
      - name: Build bridge tests
        run: cmake --build build --config Release --target host_authority_bridge_tests
      - name: Run bridge tests
        run: ctest --test-dir build -C Release -R '^host_authority_bridge_tests$' --output-on-failure
      - name: Measure bridge fixture peak working set
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\build\Release\host_authority_bridge_tests.exe' -PassThru
          $peak = 0
          while (-not $process.HasExited) {
            $process.Refresh()
            if ($process.WorkingSet64 -gt $peak) { $peak = $process.WorkingSet64 }
            Start-Sleep -Milliseconds 1
          }
          if ($process.ExitCode -ne 0) { throw "bridge test exit=$($process.ExitCode)" }
          Write-Host "bridge_test_peak_working_set_bytes=$peak"
      - name: Install
        run: cmake --install build --config Release --prefix '${{ runner.temp }}\dtv-install'
      - name: Configure installed consumer
        run: cmake -S tests/consumer/host_authority_bridge -B consumer-build -A x64 -DCMAKE_PREFIX_PATH='${{ runner.temp }}\dtv-install'
      - name: Build installed consumer
        run: cmake --build consumer-build --config Release
      - name: Run installed consumer
        run: .\consumer-build\Release\host_authority_bridge_consumer.exe
